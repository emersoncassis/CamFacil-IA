[package]
name = "cf-notify"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Notificações do CamFácil IA: Telegram (Bot API oficial), fila offline e cofre de segredos"

[dependencies]
base64 = "0.23.1"
cf-core = { path = "../cf-core" }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc", "getrandom"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", default-features = false, features = ["rt", "time", "sync", "macros"] }
