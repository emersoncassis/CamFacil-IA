[package]
name = "cf-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
base64 = "0.23.1"
ed25519-dalek = "3.0.0"
getrandom = "0.4.3"
md-5 = { version = "0.11.0", default-features = false }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
# SHA-1 só para o UsernameToken do ONVIF (WS-Security exige); já vem no binário pelo tungstenite.
sha1 = { version = "0.11.0", default-features = false }
sysinfo = { version = "0.40.1", default-features = false, features = ["system"] }
tokio = { version = "1.54.1", default-features = false, features = ["net", "time", "macros", "rt", "io-util"] }
