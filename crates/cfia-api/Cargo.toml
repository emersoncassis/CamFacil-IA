[package]
name = "cfia-api"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["ws", "macros"] }
base64 = "0.23.1"
deadpool-postgres = "0.14.2"
ed25519-dalek = "3.0.0"
futures-util = "0.3.34"
getrandom = "0.4.3"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "form"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
time = { version = "0.3.55", features = ["serde", "formatting"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync"] }
tokio-postgres = { version = "0.7.18", features = ["with-uuid-1", "with-time-0_3", "with-serde_json-1"] }
uuid = { version = "1.29.1", features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
