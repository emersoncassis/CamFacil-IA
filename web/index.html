<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>CamFácil IA</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/tokens.css">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11 12 4l8 7v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></symbol>
      <symbol id="i-cam" viewBox="0 0 24 24"><path d="M4 7h11v10H4z"/><path d="m15 11 5-3v8l-5-3"/></symbol>
      <symbol id="i-chip" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1.5"/><path d="M10 3v4M14 3v4M10 17v4M14 17v4M3 10h4M3 14h4M17 10h4M17 14h4"/></symbol>
      <symbol id="i-plug" viewBox="0 0 24 24"><path d="M9 3v5M15 3v5M6 8h12v3a6 6 0 0 1-12 0zM12 17v4"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor" stroke="none"/></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="1.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="1.5"/><path d="M5 15V5a1 1 0 0 1 1-1h9"/></symbol>
      <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></symbol>
    </defs>
  </svg>

  <div class="shell">
    <aside class="rail">
      <div class="brand">
        <img src="/icon.svg" width="22" height="22" alt="">
        <span>CamFácil IA</span>
      </div>
      <nav aria-label="Seções">
        <ul class="nav" role="tablist">
          <li><button role="tab" data-tab="inicio" aria-selected="true"><svg class="ico"><use href="#i-home"/></svg><span data-i18n="tab.inicio"></span></button></li>
          <li><button role="tab" data-tab="cameras"><svg class="ico"><use href="#i-cam"/></svg><span data-i18n="tab.cameras"></span></button></li>
          <li><button role="tab" data-tab="modulos"><svg class="ico"><use href="#i-chip"/></svg><span data-i18n="tab.modulos"></span></button></li>
          <li><button role="tab" data-tab="integracoes"><svg class="ico"><use href="#i-plug"/></svg><span data-i18n="tab.integracoes"></span></button></li>
        </ul>
      </nav>
      <div class="rail-foot">
        <div class="live"><span class="dot" id="live-dot"></span><span id="live-text" data-i18n="status.conectando"></span></div>
        <div class="tiny mono" id="rail-meta"></div>
      </div>
    </aside>

    <main>
      <!-- Início -->
      <section id="inicio" class="page" role="tabpanel">
        <header class="pagehead">
          <div>
            <h1 data-i18n="inicio.titulo"></h1>
            <p class="lede" data-i18n="guia.inicio"></p>
          </div>
          <button class="btn primary" id="bench-run"><svg class="ico"><use href="#i-play"/></svg><span data-i18n="inicio.teste_btn"></span></button>
        </header>

        <div class="block">
          <h2 data-i18n="inicio.teste"></h2>
          <div id="bench-result"></div>
        </div>

        <div class="block">
          <h2 data-i18n="inicio.selos"></h2>
          <div class="selos" id="selos"></div>
        </div>

        <div class="block">
          <h2 data-i18n="inicio.maquina"></h2>
          <dl class="rows" id="sysinfo"></dl>
        </div>
      </section>

      <!-- Câmeras -->
      <section id="cameras" class="page" role="tabpanel" hidden>
        <header class="pagehead">
          <div>
            <h1 data-i18n="tab.cameras"></h1>
            <p class="lede" data-i18n="guia.cameras"></p>
          </div>
          <button class="btn primary" id="discover"><svg class="ico"><use href="#i-search"/></svg><span data-i18n="cam.busca_btn"></span></button>
        </header>

        <div class="block">
          <div class="block-head">
            <h2 data-i18n="cam.suas"></h2>
            <div class="actions">
              <button class="btn sm" id="add-demo" data-i18n="cam.add_demo"></button>
              <button class="btn sm" id="add-webcam" data-i18n="cam.add_webcam"></button>
            </div>
          </div>
          <p class="note warn" id="ffmpeg-aviso" hidden><svg class="ico sm"><use href="#i-info"/></svg><span id="ffmpeg-texto"></span></p>
          <div class="table-wrap">
            <table class="table">
              <thead><tr><th data-i18n="cam.col_nome"></th><th data-i18n="cam.col_fonte"></th><th data-i18n="cam.col_situacao"></th><th class="right"></th></tr></thead>
              <tbody id="minhas"></tbody>
            </table>
          </div>
        </div>

        <div class="block" id="aovivo" hidden>
          <div class="block-head">
            <h2 id="aovivo-nome"></h2>
            <div class="seg" role="radiogroup" id="modo">
              <label><input type="radio" name="modo" value="ver" checked><span data-i18n="desenho.ver"></span></label>
              <label><input type="radio" name="modo" value="zona"><span data-i18n="desenho.zona"></span></label>
              <label><input type="radio" name="modo" value="linha"><span data-i18n="desenho.linha"></span></label>
            </div>
          </div>
          <div class="viewer" id="viewer">
            <img id="video" alt="">
            <svg id="desenho" viewBox="0 0 1000 1000" preserveAspectRatio="none" aria-hidden="true"></svg>
            <div id="baloes"></div>
            <div class="viewer-off" id="viewer-off" hidden></div>
          </div>
          <p class="note" id="desenho-dica"></p>
          <form class="form regra-form" id="regra-form" hidden autocomplete="off">
            <label class="span-2"><span data-i18n="regra.nome"></span><input name="nome" required maxlength="40"></label>
            <label class="zona-only"><span data-i18n="regra.on"></span><input name="rotulo_on" maxlength="24"></label>
            <label class="zona-only"><span data-i18n="regra.off"></span><input name="rotulo_off" maxlength="24"></label>
            <div class="actions span-4">
              <button class="btn primary" type="submit" data-i18n="regra.salvar"></button>
              <button class="btn" type="button" id="regra-cancelar" data-i18n="regra.cancelar"></button>
            </div>
          </form>
          <div class="table-wrap mt">
            <table class="table">
              <thead><tr><th data-i18n="regra.col_nome"></th><th data-i18n="regra.col_tipo"></th><th data-i18n="regra.col_estado"></th><th class="right"></th></tr></thead>
              <tbody id="regras"></tbody>
            </table>
          </div>
        </div>

        <div class="block">
          <h2 data-i18n="cam.encontradas"></h2>
          <div class="table-wrap">
            <table class="table">
              <thead><tr><th data-i18n="cam.col_ip"></th><th data-i18n="cam.col_fab"></th><th data-i18n="cam.col_modelo"></th><th data-i18n="cam.col_mac"></th><th class="right"></th></tr></thead>
              <tbody id="found"></tbody>
            </table>
          </div>
        </div>

        <div class="block">
          <h2 data-i18n="cam.gerador"></h2>
          <form id="rtsp-form" class="form" autocomplete="off">
            <label class="span-2"><span data-i18n="cam.fabricante"></span><select name="fabricante" id="vendor"></select></label>
            <label class="span-2"><span data-i18n="cam.ip"></span><input name="ip" required placeholder="192.168.1.108" class="mono" inputmode="decimal"></label>
            <label><span data-i18n="cam.porta"></span><input name="porta" type="number" value="554" min="1" max="65535" class="mono"></label>
            <label><span data-i18n="cam.canal"></span><input name="canal" type="number" value="1" min="1" class="mono"></label>
            <label><span data-i18n="cam.usuario"></span><input name="usuario" value="admin"></label>
            <label><span data-i18n="cam.senha"></span><input name="senha" type="password"></label>
            <fieldset class="span-4">
              <legend data-i18n="cam.stream"></legend>
              <div class="seg" role="radiogroup">
                <label><input type="radio" name="stream" value="principal"><span data-i18n="cam.principal"></span></label>
                <label><input type="radio" name="stream" value="secundario" checked><span data-i18n="cam.secundario"></span></label>
                <label><input type="radio" name="stream" value="extra"><span data-i18n="cam.extra"></span></label>
              </div>
              <p class="note"><svg class="ico sm"><use href="#i-info"/></svg><span data-i18n="cam.dica_secundario"></span></p>
            </fieldset>
            <div class="actions span-4">
              <button class="btn primary" type="submit" data-i18n="cam.gerar"></button>
              <button class="btn" type="button" id="rtsp-test" data-i18n="cam.testar"></button>
            </div>
          </form>
          <div id="rtsp-out" class="result" hidden>
            <code class="mono" id="rtsp-url"></code>
            <button class="btn ghost sm" id="rtsp-copy" type="button"><svg class="ico sm"><use href="#i-copy"/></svg><span data-i18n="cam.copiar"></span></button>
          </div>
          <form class="add-cam" id="add-rtsp" hidden autocomplete="off">
            <input name="nome" required maxlength="60" data-i18n-ph="cam.nome_ph">
            <button class="btn primary" type="submit" data-i18n="cam.adicionar"></button>
          </form>
          <p id="rtsp-msg" class="msg" role="status"></p>
        </div>
      </section>

      <!-- Módulos de IA -->
      <section id="modulos" class="page" role="tabpanel" hidden>
        <header class="pagehead">
          <div>
            <h1 data-i18n="tab.modulos"></h1>
            <p class="lede" data-i18n="guia.modulos"></p>
          </div>
        </header>
        <div class="block">
          <div class="table-wrap">
            <table class="table">
              <thead><tr><th data-i18n="mod.col_modulo"></th><th data-i18n="mod.col_nivel"></th><th data-i18n="mod.col_estado"></th><th class="right" data-i18n="mod.col_ativo"></th></tr></thead>
              <tbody id="levels"></tbody>
            </table>
          </div>
        </div>
      </section>

      <!-- Integrações -->
      <section id="integracoes" class="page" role="tabpanel" hidden>
        <header class="pagehead">
          <div>
            <h1 data-i18n="tab.integracoes"></h1>
            <p class="lede" data-i18n="guia.integracoes"></p>
          </div>
        </header>
        <div class="block" id="elo">
          <h2 data-i18n="elo.titulo"></h2>
          <p class="hint" data-i18n="elo.desc"></p>
          <dl class="rows mt">
            <dt data-i18n="elo.situacao"></dt><dd><span class="state"><span class="dot" id="elo-dot"></span><span id="elo-status"></span></span></dd>
            <dt data-i18n="elo.impressao"></dt><dd class="mono" id="elo-impressao">—</dd>
            <dt data-i18n="elo.site"></dt><dd class="mono" id="elo-site">—</dd>
          </dl>
          <div class="pedido" id="elo-pedido" hidden>
            <p><strong id="elo-pedido-email"></strong> <span data-i18n="elo.pedido"></span></p>
            <p class="hint" data-i18n="elo.pedido_dica"></p>
            <div class="actions">
              <button class="btn primary" id="elo-aceitar" data-i18n="elo.aceitar"></button>
              <button class="btn" id="elo-recusar" data-i18n="elo.recusar"></button>
            </div>
          </div>
          <div class="qr-area" id="elo-qr-area" hidden>
            <div class="qr"><img id="elo-qr" alt="" width="200" height="200"></div>
            <div>
              <p data-i18n="elo.qr_passo"></p>
              <p class="hint"><span data-i18n="elo.expira"></span> <span class="mono" id="elo-expira"></span></p>
            </div>
          </div>
          <div class="actions mt">
            <button class="btn primary" id="elo-parear" data-i18n="elo.parear"></button>
            <button class="btn" id="elo-desparear" data-i18n="elo.desparear" hidden></button>
          </div>
          <p class="msg" id="elo-msg" role="status"></p>
        </div>
        <div class="block">
          <ul class="list">
            <li><div><strong>Telegram</strong><p data-i18n="int.telegram"></p></div><span class="badge" data-i18n="em_breve"></span></li>
            <li><div><strong>WhatsApp</strong><p data-i18n="int.whatsapp"></p></div><span class="badge" data-i18n="em_breve"></span></li>
            <li><div><strong data-i18n="int.marca"></strong><p data-i18n="int.marca_desc"></p></div><span class="badge" data-i18n="em_breve"></span></li>
          </ul>
        </div>
      </section>

      <footer class="foot" data-i18n="rodape"></footer>
    </main>
  </div>

  <aside class="aula" id="aula" hidden role="dialog" aria-live="polite" aria-labelledby="aula-titulo">
    <div class="aula-topo"><strong id="aula-titulo"></strong><span class="tiny mono" id="aula-passo"></span></div>
    <p id="aula-texto"></p>
    <div class="actions">
      <button class="btn primary sm" id="aula-proximo" data-i18n="aula.proximo"></button>
      <button class="btn ghost sm" id="aula-ouvir" data-i18n="aula.ouvir"></button>
      <button class="btn ghost sm" id="aula-sair" data-i18n="aula.sair"></button>
    </div>
  </aside>

  <dialog id="disclaimer" aria-labelledby="disc-title">
    <h2 id="disc-title" data-i18n="isencao.titulo"></h2>
    <ol class="disc" id="disc-list"></ol>
    <div class="actions end">
      <button class="btn primary" id="disc-ok" data-i18n="isencao.aceito"></button>
    </div>
  </dialog>

  <script src="/app.js"></script>
</body>
</html>
