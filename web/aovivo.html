<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Ao vivo · CamFácil IA</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/tokens.css">
  <link rel="stylesheet" href="/aovivo.css">
</head>
<body>
  <header class="vv-topo">
    <a class="vv-marca" href="/" data-i18n-title="vivo.painel"><img src="/icon.svg" width="20" height="20" alt=""><strong data-i18n="vivo.titulo"></strong></a>
    <button type="button" class="vv-som-ligar" id="som-ligar" hidden><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 8h3l4-3v10l-4-3H3z"/><path d="M13 7.5a3.5 3.5 0 0 1 0 5M15 5a7 7 0 0 1 0 10"/></svg><span class="vv-som-txt" data-i18n="vivo.som_ligar"></span></button>
    <button type="button" class="vv-mudo" id="som-mudo" aria-pressed="false"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 8h3l4-3v10l-4-3H3z"/><path class="som-on" d="M13 7.5a3.5 3.5 0 0 1 0 5"/><path class="som-off" d="M13 8l4 4M17 8l-4 4"/></svg></button>
    <div class="vv-layouts" role="radiogroup" data-i18n-aria="vivo.layout">
      <button type="button" data-n="1" aria-label="1"><svg viewBox="0 0 20 20"><rect x="2" y="3" width="16" height="14" rx="1.5"/></svg></button>
      <button type="button" data-n="2" aria-label="2"><svg viewBox="0 0 20 20"><rect x="2" y="3" width="7.5" height="14" rx="1.5"/><rect x="10.5" y="3" width="7.5" height="14" rx="1.5"/></svg></button>
      <button type="button" data-n="3" aria-label="3"><svg viewBox="0 0 20 20"><rect x="2" y="3" width="10" height="14" rx="1.5"/><rect x="13" y="3" width="5" height="6.5" rx="1.2"/><rect x="13" y="10.5" width="5" height="6.5" rx="1.2"/></svg></button>
      <button type="button" data-n="4" aria-label="4"><svg viewBox="0 0 20 20"><rect x="2" y="3" width="7.5" height="6.5" rx="1.2"/><rect x="10.5" y="3" width="7.5" height="6.5" rx="1.2"/><rect x="2" y="10.5" width="7.5" height="6.5" rx="1.2"/><rect x="10.5" y="10.5" width="7.5" height="6.5" rx="1.2"/></svg></button>
    </div>
    <div class="vv-pag" id="pag" hidden>
      <button type="button" id="pag-ant" aria-label="‹">‹</button><span id="pag-txt"></span><button type="button" id="pag-prox" aria-label="›">›</button>
    </div>
    <a class="vv-voltar" href="/" data-i18n="vivo.painel"></a>
  </header>

  <main class="vv-mosaico" id="mosaico" data-n="4"></main>

  <section class="vv-status" aria-label="Status">
    <nav class="vv-abas" id="abas" role="tablist"></nav>
    <div class="vv-cartoes">
      <article class="vv-c" data-c="disp"><h2 data-i18n="vivo.c.disp"></h2><div id="c-disp"></div></article>
      <article class="vv-c" data-c="ia"><h2 data-i18n="vivo.c.ia"></h2><div id="c-ia"></div></article>
      <article class="vv-c" data-c="alertas"><h2 data-i18n="vivo.c.alertas"></h2><div id="c-alertas"></div></article>
      <article class="vv-c" data-c="quem"><h2 data-i18n="vivo.c.quem"></h2><div id="c-quem"></div></article>
      <article class="vv-c" data-c="serv"><h2 data-i18n="vivo.c.serv"></h2><div id="c-serv"></div></article>
    </div>
  </section>
  <dialog class="vv-dlg" id="stream-dlg" aria-labelledby="stream-dlg-t" aria-describedby="stream-dlg-d">
    <h2 id="stream-dlg-t" data-i18n="stream.pergunta"></h2>
    <p id="stream-dlg-d" data-i18n="stream.aviso"></p>
    <div class="vv-dlg-acoes">
      <button type="button" class="vv-btn" id="stream-nao" data-i18n="stream.ficar_extra"></button>
      <button type="button" class="vv-btn aviso" id="stream-sim" data-i18n="stream.usar_principal"></button>
    </div>
  </dialog>
  <script src="/sons.js"></script>
  <script src="/aovivo.js"></script>
</body>
</html>
