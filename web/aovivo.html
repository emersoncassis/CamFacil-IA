<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Ao vivo · CamFácil IA</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/tokens.css">
  <style>
    /* Zero rolagem: o mosaico ocupa a tela que sobrar e pagina o excesso. */
    html, body { height: 100%; overflow: hidden; }
    body { margin: 0; display: flex; flex-direction: column; height: 100vh; height: 100dvh; background: var(--bg); color: var(--text); font-family: var(--font); }
    header { flex: none; display: flex; align-items: center; gap: var(--s2); padding: var(--s2) var(--s3); border-bottom: 1px solid var(--line); }
    header strong { font-size: var(--fs-md); white-space: nowrap; }
    header .tiny { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-3); font-size: var(--fs-xs); margin-left: auto; font-variant-numeric: tabular-nums; }
    header a { color: var(--text-2); font-size: var(--fs-sm); white-space: nowrap; }
    .pag { display: inline-flex; align-items: center; gap: var(--s1); }
    .pag button { display: inline-grid; place-items: center; width: 36px; height: 32px; padding: 0; color: var(--text-2); background: none; border: 1px solid var(--line-strong); border-radius: var(--r); cursor: pointer; }
    .pag button:disabled { opacity: .35; cursor: default; }
    .pag svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .mosaico { flex: 1; min-height: 0; display: grid; gap: var(--s1); padding: var(--s1); align-content: center; }
    figure { margin: 0; position: relative; min-width: 0; min-height: 0; background: var(--surface); border-radius: var(--r-sm); overflow: hidden; cursor: zoom-in; }
    figure img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; }
    figcaption { position: absolute; left: var(--s1); bottom: var(--s1); padding: 2px var(--s2); border-radius: var(--r-pill); background: var(--c-black); color: var(--text); font-size: var(--fs-xs); display: flex; align-items: center; gap: 6px; }
    figcaption i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
    figure.off figcaption i { background: var(--c-danger); }
    figure.cheia { position: fixed; inset: 0; z-index: 2; border-radius: 0; cursor: zoom-out; }
    .vazio { padding: var(--s5) var(--s3); color: var(--text-2); text-align: center; }
  </style>
</head>
<body>
  <header>
    <img src="/icon.svg" width="20" height="20" alt="">
    <strong id="titulo">Ao vivo</strong>
    <span class="tiny" id="info"></span>
    <span class="pag" id="pag" hidden>
      <button type="button" id="ant"><svg viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg></button>
      <button type="button" id="prox"><svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></button>
    </span>
    <a href="/">Painel completo</a>
  </header>
  <main class="mosaico" id="mosaico"></main>
  <script src="/aovivo.js"></script>
</body>
</html>
