<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="CamFácil IA: inteligência de vídeo para quem instala câmeras">
  <style>
    .t { font: 700 64px system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #ededed; letter-spacing: -2px; }
    .t tspan { fill: #06cb3f; }
    .s { font: 400 20px system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #b4b4b4; }
    .m { font: 500 13px ui-monospace, 'Cascadia Mono', Consolas, monospace; fill: #06cb3f; letter-spacing: 1.5px; }
    .b { font: 600 14px system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #000; }
  </style>
  <defs>
    <pattern id="grade" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#06cb3f" stroke-opacity=".07"/>
    </pattern>
    <linearGradient id="varre" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06cb3f" stop-opacity="0"/>
      <stop offset="1" stop-color="#06cb3f" stop-opacity=".18"/>
    </linearGradient>
    <radialGradient id="luz" cx=".78" cy=".5" r=".45">
      <stop offset="0" stop-color="#06cb3f" stop-opacity=".14"/>
      <stop offset="1" stop-color="#06cb3f" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="quadro"><rect width="1200" height="300" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#quadro)">
    <rect width="1200" height="300" fill="#000"/>
    <rect width="1200" height="300" fill="url(#grade)"/>
    <rect width="1200" height="300" fill="url(#luz)"/>

    <!-- Linha de varredura da câmera -->
    <rect x="0" y="-80" width="1200" height="80" fill="url(#varre)">
      <animate attributeName="y" values="-80;300" dur="4s" repeatCount="indefinite"/>
    </rect>

    <!-- Cena à direita: chão, linha virtual e uma pessoa atravessando -->
    <path d="M690 250 L1150 222" stroke="#06cb3f" stroke-width="4" stroke-dasharray="16 12" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" values="0;-56" dur="1.4s" repeatCount="indefinite"/>
    </path>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 0;-10 0;0 0" keyTimes="0;.5;.75;1" dur="6s" repeatCount="indefinite"/>
      <!-- silhueta -->
      <g fill="#ededed" fill-opacity=".9">
        <circle cx="905" cy="128" r="17"/>
        <path d="M884 150 q21 -8 42 0 l7 62 h-14 l-4 48 h-11 l-2 -40 h-2 l-2 40 h-11 l-4 -48 h-14z"/>
      </g>
    </g>

    <!-- Mira: procura, trava na pessoa e dispara o balão -->
    <g fill="none" stroke="#06cb3f" stroke-width="3">
      <animateTransform attributeName="transform" type="translate"
        values="-260 -40; -120 50; 30 -30; 0 0; 0 0; 0 0; -260 -40"
        keyTimes="0; .18; .34; .46; .7; .9; 1" dur="6s" repeatCount="indefinite"
        calcMode="spline" keySplines=".4 0 .2 1; .4 0 .2 1; .4 0 .2 1; 0 0 1 1; 0 0 1 1; .4 0 .2 1"/>
      <g>
        <path d="M855 108 v-20 h20 M935 88 h20 v20 M955 248 v20 h-20 M875 268 h-20 v-20"/>
        <circle cx="905" cy="178" r="6" fill="#06cb3f" stroke="none"/>
        <circle cx="905" cy="178" r="20" stroke-width="2" stroke-opacity=".6">
          <animate attributeName="r" values="12;34;12" dur="1.2s" repeatCount="indefinite"/>
          <animate attributeName="stroke-opacity" values=".8;0;.8" dur="1.2s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>

    <!-- Balão de inteligência (aparece quando a mira trava) -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.46;.5;.86;.9;1" dur="6s" repeatCount="indefinite"/>
      <rect x="975" y="110" width="180" height="40" rx="20" fill="#06cb3f"/>
      <text x="1065" y="136" text-anchor="middle" class="b">Pessoa · na linha</text>
    </g>

    <!-- HUD -->
    <g fill="none" stroke="#06cb3f" stroke-width="3">
      <path d="M24 66V24h42M1134 24h42v42M1176 234v42h-42M66 276H24v-42"/>
    </g>
    <circle cx="48" cy="48" r="7" fill="#ff4d4d"><animate attributeName="opacity" values="1;.2;1" dur="1.4s" repeatCount="indefinite"/></circle>
    <text x="64" y="53" class="m">REC · CAM 01</text>
    <text x="1152" y="262" text-anchor="end" class="m">IA NO PC · 5 Q/S</text>

    <!-- Título -->
    <text x="64" y="160" class="t">CamFácil <tspan>IA</tspan></text>
    <text x="66" y="200" class="s">Inteligência de vídeo para quem instala câmeras</text>
  </g>
  <rect x="1" y="1" width="1198" height="298" rx="17" fill="none" stroke="#232323" stroke-width="2"/>
</svg>
