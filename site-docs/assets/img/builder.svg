<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" role="img" aria-label="CamFácil IA Builder: um robô técnico de CFTV, com uma câmera dome na cabeça e uma chave de fenda na mão, escreve código num notebook ligado a ele por um cabo de rede.">
  <defs>
    <pattern id="b-grade" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#06cb3f" stroke-opacity=".06"/>
    </pattern>
    <radialGradient id="b-luz" cx=".36" cy=".5" r=".55">
      <stop offset="0" stop-color="#06cb3f" stop-opacity=".13"/>
      <stop offset="1" stop-color="#06cb3f" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="b-quadro"><rect width="640" height="440" rx="18"/></clipPath>
    <clipPath id="b-tela"><rect x="398" y="150" width="190" height="124" rx="4"/></clipPath>
  </defs>

  <g clip-path="url(#b-quadro)">
    <rect width="640" height="440" fill="#000"/>
    <rect width="640" height="440" fill="url(#b-grade)"/>
    <rect width="640" height="440" fill="url(#b-luz)"/>

    <!-- Chão -->
    <path d="M40 372H600" stroke="#2e2e2e" stroke-width="2" stroke-linecap="round"/>

    <!-- Cabo de rede: do robô ao notebook, com dados passando -->
    <path d="M258 312 C300 372 360 372 420 340 S470 318 492 318" fill="none" stroke="#2e2e2e" stroke-width="5" stroke-linecap="round"/>
    <path d="M258 312 C300 372 360 372 420 340 S470 318 492 318" fill="none" stroke="#06cb3f" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 16">
      <animate attributeName="stroke-dashoffset" values="0;-44" dur="1.2s" repeatCount="indefinite"/>
    </path>

    <!-- Notebook -->
    <g>
      <rect x="390" y="142" width="206" height="140" rx="8" fill="#0a0a0a" stroke="#ededed" stroke-width="3"/>
      <rect x="398" y="150" width="190" height="124" rx="4" fill="#111"/>
      <g clip-path="url(#b-tela)">
        <!-- barra da janela -->
        <rect x="398" y="150" width="190" height="16" fill="#171717"/>
        <circle cx="408" cy="158" r="2.5" fill="#8a8a8a"/>
        <circle cx="417" cy="158" r="2.5" fill="#8a8a8a"/>
        <circle cx="426" cy="158" r="2.5" fill="#8a8a8a"/>
        <!-- linhas de código sendo escritas -->
        <g stroke-linecap="round" stroke-width="5" fill="none">
          <path d="M410 180h70" stroke="#06cb3f" stroke-dasharray="70" stroke-dashoffset="70">
            <animate attributeName="stroke-dashoffset" values="70;70;0;0;70" keyTimes="0;.04;.14;.94;1" dur="7s" repeatCount="indefinite"/>
          </path>
          <path d="M422 196h120" stroke="#ededed" stroke-opacity=".8" stroke-dasharray="120" stroke-dashoffset="120">
            <animate attributeName="stroke-dashoffset" values="120;120;0;0;120" keyTimes="0;.16;.3;.94;1" dur="7s" repeatCount="indefinite"/>
          </path>
          <path d="M422 212h86" stroke="#8a8a8a" stroke-dasharray="86" stroke-dashoffset="86">
            <animate attributeName="stroke-dashoffset" values="86;86;0;0;86" keyTimes="0;.32;.43;.94;1" dur="7s" repeatCount="indefinite"/>
          </path>
          <path d="M434 228h104" stroke="#ededed" stroke-opacity=".8" stroke-dasharray="104" stroke-dashoffset="104">
            <animate attributeName="stroke-dashoffset" values="104;104;0;0;104" keyTimes="0;.45;.58;.94;1" dur="7s" repeatCount="indefinite"/>
          </path>
          <path d="M410 244h44" stroke="#06cb3f" stroke-dasharray="44" stroke-dashoffset="44">
            <animate attributeName="stroke-dashoffset" values="44;44;0;0;44" keyTimes="0;.6;.67;.94;1" dur="7s" repeatCount="indefinite"/>
          </path>
        </g>
        <!-- cursor -->
        <rect x="462" y="238" width="3" height="12" fill="#ededed">
          <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.5;.5;1" dur="1s" repeatCount="indefinite"/>
        </rect>
        <!-- selo: passou nas regras -->
        <g opacity="0">
          <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.72;.78;.94;1" dur="7s" repeatCount="indefinite"/>
          <circle cx="562" cy="250" r="13" fill="#06cb3f"/>
          <path d="M555.500 250.500l4.500 4.500 9-9.500" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </g>
      <!-- base e teclado -->
      <path d="M372 318l18-34h206l18 34z" fill="#0a0a0a" stroke="#ededed" stroke-width="3" stroke-linejoin="round"/>
      <path d="M404 296h178M398 306h190" stroke="#2e2e2e" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 6"/>
      <path d="M366 318h254" stroke="#ededed" stroke-width="3" stroke-linecap="round"/>
      <path d="M430 372v-54M556 372v-54" stroke="#2e2e2e" stroke-width="3"/>
    </g>

    <!-- Robô -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="3.2s" repeatCount="indefinite"/>

      <!-- sombra no chão -->
      <ellipse cx="205" cy="372" rx="70" ry="5" fill="#06cb3f" fill-opacity=".1"/>

      <!-- pernas -->
      <path d="M178 330v34M232 330v34" stroke="#ededed" stroke-width="12" stroke-linecap="round"/>
      <path d="M162 368h32M216 368h32" stroke="#ededed" stroke-width="8" stroke-linecap="round"/>

      <!-- braço esquerdo, levantado, com chave de fenda -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 136 246;-9 136 246;0 136 246;5 136 246;0 136 246" dur="2.6s" repeatCount="indefinite"/>
        <path d="M136 246L96 214" stroke="#ededed" stroke-width="12" stroke-linecap="round"/>
        <circle cx="92" cy="210" r="11" fill="#0a0a0a" stroke="#ededed" stroke-width="3"/>
        <!-- chave de fenda -->
        <rect x="80" y="166" width="16" height="36" rx="6" transform="rotate(-18 88 184)" fill="#06cb3f"/>
        <path d="M80 164L68 126" stroke="#b4b4b4" stroke-width="5" stroke-linecap="round"/>
        <path d="M64 128l8-3" stroke="#b4b4b4" stroke-width="5" stroke-linecap="round"/>
      </g>

      <!-- braço direito, no teclado -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 274 250;3 274 250;0 274 250;-2 274 250;0 274 250" dur=".9s" repeatCount="indefinite"/>
        <path d="M274 250l46 34 48 8" fill="none" stroke="#ededed" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="374" cy="293" r="10" fill="#0a0a0a" stroke="#ededed" stroke-width="3"/>
      </g>

      <!-- corpo -->
      <rect x="132" y="228" width="146" height="108" rx="16" fill="#0a0a0a" stroke="#ededed" stroke-width="3"/>
      <!-- crachá do técnico -->
      <rect x="148" y="246" width="58" height="34" rx="5" fill="#111" stroke="#2e2e2e" stroke-width="2"/>
      <text x="177" y="268" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="14" font-weight="600" fill="#ededed" letter-spacing="1">CFIA</text>
      <!-- portas de rede com LED -->
      <g fill="#111" stroke="#2e2e2e" stroke-width="2">
        <rect x="220" y="246" width="18" height="14" rx="2"/>
        <rect x="244" y="246" width="18" height="14" rx="2"/>
      </g>
      <circle cx="229" cy="270" r="3" fill="#06cb3f">
        <animate attributeName="opacity" values="1;.2;1" dur=".7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="253" cy="270" r="3" fill="#e0b341">
        <animate attributeName="opacity" values=".2;1;.2" dur="1.1s" repeatCount="indefinite"/>
      </circle>
      <!-- grade de ventilação -->
      <path d="M150 300h110M150 312h110" stroke="#2e2e2e" stroke-width="3" stroke-linecap="round"/>
      <!-- conector do cabo -->
      <rect x="248" y="302" width="18" height="16" rx="3" fill="#171717" stroke="#ededed" stroke-width="2"/>

      <!-- pescoço -->
      <rect x="190" y="210" width="30" height="20" fill="#171717" stroke="#ededed" stroke-width="3"/>

      <!-- cabeça -->
      <rect x="124" y="112" width="162" height="102" rx="22" fill="#0a0a0a" stroke="#ededed" stroke-width="3"/>
      <!-- visor -->
      <rect x="140" y="136" width="130" height="50" rx="14" fill="#000" stroke="#2e2e2e" stroke-width="2"/>
      <!-- olhos que piscam -->
      <g fill="#ededed">
        <rect x="166" y="149" width="18" height="24" rx="8">
          <animate attributeName="height" values="24;24;3;24;24" keyTimes="0;.9;.94;.98;1" dur="4.4s" repeatCount="indefinite"/>
          <animate attributeName="y" values="149;149;160;149;149" keyTimes="0;.9;.94;.98;1" dur="4.4s" repeatCount="indefinite"/>
        </rect>
        <rect x="226" y="149" width="18" height="24" rx="8">
          <animate attributeName="height" values="24;24;3;24;24" keyTimes="0;.9;.94;.98;1" dur="4.4s" repeatCount="indefinite"/>
          <animate attributeName="y" values="149;149;160;149;149" keyTimes="0;.9;.94;.98;1" dur="4.4s" repeatCount="indefinite"/>
        </rect>
      </g>
      <!-- sorriso -->
      <path d="M192 196q13 8 26 0" fill="none" stroke="#ededed" stroke-width="3" stroke-linecap="round"/>
      <!-- orelhas -->
      <rect x="112" y="146" width="12" height="30" rx="4" fill="#171717" stroke="#ededed" stroke-width="3"/>
      <rect x="286" y="146" width="12" height="30" rx="4" fill="#171717" stroke="#ededed" stroke-width="3"/>

      <!-- câmera dome no topo da cabeça -->
      <rect x="172" y="100" width="66" height="12" rx="4" fill="#171717" stroke="#ededed" stroke-width="3"/>
      <path d="M180 100a25 25 0 0 1 50 0z" fill="#111" stroke="#ededed" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="205" cy="90" r="6" fill="#06cb3f">
        <animate attributeName="cx" values="205;194;205;216;205" dur="5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="205" cy="90" r="6" fill="none" stroke="#06cb3f" stroke-opacity=".5">
        <animate attributeName="cx" values="205;194;205;216;205" dur="5s" repeatCount="indefinite"/>
        <animate attributeName="r" values="6;13" dur="1.6s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values=".5;0" dur="1.6s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
</svg>
