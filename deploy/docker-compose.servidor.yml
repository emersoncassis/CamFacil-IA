# CamFácil IA · deploy direto no servidor do Dokploy (sem passar pelo painel).
# Usa o Traefik do Dokploy (rede dokploy-network) para HTTPS automático.
# Uso: veja docs/DEPLOY.md, seção "Pelo terminal".
services:
  cfia-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    image: camfacil/cfia-api:local
    container_name: cfia-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://cfia:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}@cfia-db:5432/cfia
      BASE_URL: https://${CFIA_DOMINIO:-cfia.ysafe.com.br}
      PORT: "8080"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    depends_on:
      cfia-db:
        condition: service_healthy
    networks:
      - interna
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.services.cfia.loadbalancer.server.port=8080
      - traefik.http.routers.cfia.rule=Host(`${CFIA_DOMINIO:-cfia.ysafe.com.br}`)
      - traefik.http.routers.cfia.entrypoints=websecure
      - traefik.http.routers.cfia.tls.certresolver=letsencrypt
      - traefik.http.routers.cfia-http.rule=Host(`${CFIA_DOMINIO:-cfia.ysafe.com.br}`)
      - traefik.http.routers.cfia-http.entrypoints=web
      - traefik.http.routers.cfia-http.middlewares=cfia-https
      - traefik.http.middlewares.cfia-https.redirectscheme.scheme=https

  cfia-db:
    image: postgres:16-alpine
    container_name: cfia-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cfia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: cfia
    volumes:
      - cfia-db-dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cfia -d cfia"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - interna

volumes:
  cfia-db-dados:

networks:
  interna:
  dokploy-network:
    external: true
