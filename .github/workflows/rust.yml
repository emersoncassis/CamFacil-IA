name: rust

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt · clippy · testes
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: teste
          POSTGRES_DB: cfia_teste
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:teste@localhost:5432/cfia_teste
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  budget:
    name: orçamento de leveza
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: scripts/budget.sh

  build:
    name: build ${{ matrix.name }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            bin: camfacil.exe
            asset: camfacil-windows-x86_64.exe
          - name: linux-x86_64
            os: ubuntu-latest
            bin: camfacil
            asset: camfacil-linux-x86_64
          - name: linux-arm64
            os: ubuntu-24.04-arm
            bin: camfacil
            asset: camfacil-linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p camfacil
      - name: Nome do arquivo de download
        shell: bash
        run: mkdir -p dist && cp target/release/${{ matrix.bin }} dist/${{ matrix.asset }}
      - uses: actions/upload-artifact@v5
        with:
          name: camfacil-${{ matrix.name }}
          path: dist/${{ matrix.asset }}

  release:
    name: publicar versão
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Junta os instaladores e as somas de verificação
        run: |
          cp scripts/install.sh scripts/install.ps1 dist/
          cd dist && sha256sum * > SHA256SUMS.txt && ls -la
      - name: Cria a versão no GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* --title "CamFácil IA ${GITHUB_REF_NAME}" \
            --notes "Baixe pelo site https://cfia.ysafe.com.br ou veja o README. Windows: camfacil-windows-x86_64.exe · Linux: camfacil-linux-x86_64 · Raspberry Pi/ARM 64: camfacil-linux-arm64." \
            || gh release upload "${GITHUB_REF_NAME}" dist/* --clobber

  imagem-api:
    name: imagem Docker da API
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - run: docker build -f deploy/Dockerfile.api -t cfia-api:ci .
      - name: Sobe e responde em /api/saude
        run: |
          docker network create t
          docker run -d --name db --network t -e POSTGRES_PASSWORD=x -e POSTGRES_USER=cfia -e POSTGRES_DB=cfia postgres:16-alpine
          docker run -d --name api --network t -p 8080:8080 -e DATABASE_URL=postgres://cfia:x@db:5432/cfia -e BASE_URL=http://localhost:8080 cfia-api:ci
          for i in $(seq 1 40); do curl -fsS localhost:8080/api/saude && exit 0; sleep 2; done
          docker logs api; exit 1
      - name: Publica no GitHub Container Registry
        if: github.event_name == 'push'
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          IMG=ghcr.io/emersoncassis/camfacil-ia-painel
          docker tag cfia-api:ci $IMG:latest
          docker push $IMG:latest
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then docker tag cfia-api:ci $IMG:${GITHUB_REF_NAME}; docker push $IMG:${GITHUB_REF_NAME}; fi
