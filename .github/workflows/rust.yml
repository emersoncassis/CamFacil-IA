name: rust

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt · clippy · testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  budget:
    name: orçamento de leveza
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: scripts/budget.sh

  build:
    name: build ${{ matrix.name }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            bin: camfacil.exe
          - name: linux-x86_64
            os: ubuntu-latest
            bin: camfacil
          - name: linux-arm64
            os: ubuntu-24.04-arm
            bin: camfacil
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p camfacil
      - uses: actions/upload-artifact@v4
        with:
          name: camfacil-${{ matrix.name }}
          path: target/release/${{ matrix.bin }}
