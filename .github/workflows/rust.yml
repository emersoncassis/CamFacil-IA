name: rust

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt · clippy · testes
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: teste
          POSTGRES_DB: cfia_teste
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:teste@localhost:5432/cfia_teste
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  budget:
    name: orçamento de leveza
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: scripts/budget.sh

  build:
    name: build ${{ matrix.name }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            bin: camfacil.exe
            asset: camfacil-windows-x86_64.exe
          - name: linux-x86_64
            os: ubuntu-latest
            bin: camfacil
            asset: camfacil-linux-x86_64
          - name: linux-arm64
            os: ubuntu-24.04-arm
            bin: camfacil
            asset: camfacil-linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p camfacil
      - name: Nome do arquivo de download
        shell: bash
        run: mkdir -p dist && cp target/release/${{ matrix.bin }} dist/${{ matrix.asset }}
      - uses: actions/upload-artifact@v5
        with:
          name: camfacil-${{ matrix.name }}
          path: dist/${{ matrix.asset }}

  android:
    name: build android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: SDK do Android (plataforma 35)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null
      # Servidor no aparelho (ADR 0011): núcleo Rust + ffmpeg mínimo em jniLibs.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - name: cargo-ndk
        run: cargo install cargo-ndk --locked --version "^4"
      - name: Cache do ffmpeg mínimo (só recompila se o script mudar)
        uses: actions/cache@v4
        with:
          path: android/app/src/main/jniLibs/*/libffmpeg.so
          key: ffmpeg-android-${{ hashFiles('scripts/android-ffmpeg.sh') }}
      - name: Compila o núcleo e o ffmpeg para Android (arm64-v8a, armeabi-v7a)
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" scripts/android-nucleo.sh
      - name: Keystore de release (opcional, por secrets)
        # Sem os secrets o APK sai assinado com a chave de debug do runner
        # (instala, mas não atualiza por cima de uma versão assinada com outra chave).
        env:
          KS: ${{ secrets.CFIA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/cfia.jks"
            echo "CFIA_KEYSTORE_FILE=$RUNNER_TEMP/cfia.jks" >> "$GITHUB_ENV"
          fi
      - name: Compila o APK de release
        working-directory: android
        env:
          CFIA_KEYSTORE_SENHA: ${{ secrets.CFIA_KEYSTORE_SENHA }}
          CFIA_KEY_ALIAS: ${{ secrets.CFIA_KEY_ALIAS }}
          CFIA_KEY_SENHA: ${{ secrets.CFIA_KEY_SENHA }}
        run: ./gradlew assembleRelease --no-daemon
      - name: Nome do arquivo de download
        run: |
          mkdir -p dist && cp android/app/build/outputs/apk/release/app-release.apk dist/camfacil-android.apk
          ls -la dist
      - uses: actions/upload-artifact@v5
        with:
          name: camfacil-android
          path: dist/camfacil-android.apk

  release:
    name: publicar versão
    # Publica sozinho quando a versão do Cargo.toml ainda não tem release.
    if: github.event_name == 'push'
    needs: [build, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Versão já publicada?
        id: versao
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          echo "tag=$V" >> "$GITHUB_OUTPUT"
          if gh release view "$V" >/dev/null 2>&1; then echo "nova=nao" >> "$GITHUB_OUTPUT"; else echo "nova=sim" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/download-artifact@v5
        if: steps.versao.outputs.nova == 'sim'
        with:
          path: dist
          merge-multiple: true
      - name: Junta os instaladores e as somas de verificação
        if: steps.versao.outputs.nova == 'sim'
        run: |
          cp scripts/install.sh scripts/install.ps1 dist/
          # Cópias com o número da versão no nome (o site baixa estas); os
          # nomes fixos continuam para os instaladores e links antigos.
          V="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          for f in camfacil-windows-x86_64.exe camfacil-linux-x86_64 camfacil-linux-arm64 camfacil-android.apk; do
            [ -f "dist/$f" ] && cp "dist/$f" "dist/${f/camfacil-/camfacil-$V-}"
          done
          cd dist && sha256sum * > SHA256SUMS.txt && ls -la
      - name: Publica os modelos de IA (release modelos-v1), se ainda não existir
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view modelos-v1 >/dev/null 2>&1; then
            gh release create modelos-v1 modelos/yolo11n.onnx modelos/yolo11n.onnx.sha256 --title "Modelos de IA v1" \
              --notes "YOLO11n em ONNX (Ultralytics, AGPL-3.0), 640×640, opset 12, para o nível médio do CamFácil IA. O programa baixa sob demanda e confere o SHA-256." \
              || gh release upload modelos-v1 modelos/yolo11n.onnx modelos/yolo11n.onnx.sha256 --clobber
          fi
      - uses: actions/download-artifact@v5
        if: steps.versao.outputs.nova == 'nao'
        with:
          name: camfacil-android
          path: apk
      - name: Anexa o APK à versão atual, se ainda faltar
        if: steps.versao.outputs.nova == 'nao'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.versao.outputs.tag }}
        run: |
          if ! gh release view "$V" --json assets -q '.assets[].name' | grep -qx camfacil-android.apk; then
            N="${V#v}"
            cp apk/camfacil-android.apk "apk/camfacil-$N-android.apk"
            gh release upload "$V" apk/camfacil-android.apk "apk/camfacil-$N-android.apk"
          fi
      - name: Cria a versão no GitHub
        if: steps.versao.outputs.nova == 'sim'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.versao.outputs.tag }}
        run: |
          gh release create "$V" dist/* --target "$GITHUB_SHA" --title "CamFácil IA $V" --latest \
            --notes "Baixe pelo site https://cfia.ysafe.com.br ou veja o README. Windows: camfacil-windows-x86_64.exe · Linux: camfacil-linux-x86_64 · Raspberry Pi/ARM 64: camfacil-linux-arm64 · Android (servidor no aparelho ou visualizador): camfacil-android.apk." \
            || gh release upload "$V" dist/* --clobber

  imagem-api:
    name: imagem Docker da API
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - run: docker build -f deploy/Dockerfile.api -t cfia-api:ci .
      - name: Sobe e responde em /api/saude
        run: |
          docker network create t
          docker run -d --name db --network t -e POSTGRES_PASSWORD=x -e POSTGRES_USER=cfia -e POSTGRES_DB=cfia postgres:16-alpine
          docker run -d --name api --network t -p 8080:8080 -e DATABASE_URL=postgres://cfia:x@db:5432/cfia -e BASE_URL=http://localhost:8080 cfia-api:ci
          for i in $(seq 1 40); do curl -fsS localhost:8080/api/saude && exit 0; sleep 2; done
          docker logs api; exit 1
      - name: Publica no GitHub Container Registry
        if: github.event_name == 'push'
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          IMG=ghcr.io/emersoncassis/camfacil-ia-painel
          docker tag cfia-api:ci $IMG:latest
          docker push $IMG:latest
          V="v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          docker tag cfia-api:ci $IMG:$V && docker push $IMG:$V
